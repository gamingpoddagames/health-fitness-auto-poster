name: FitLife Daily Auto-Poster (Text-Only)

on:
  schedule:
    - cron: "0 8,11,14,17,20 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          pip install requests
      
      - name: 📝 Check content
        run: |
          if [ ! -f "posts.csv" ]; then
            echo "⚠️ Creating default content..."
            python content_generator.py
          fi
      
      - name: 🚀 Post to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python fb_poster.py
      
      - name: 💾 Push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_log.txt
          git diff --staged --quiet || git commit -m "📊 Update logs [skip ci]" || true
          git push origin main --force-with-lease || true
      
      - name: 📤 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            posted_log.txt
            posts.csv
          retention-days: 7
