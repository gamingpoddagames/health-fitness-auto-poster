name: FitLife Daily Auto-Poster

on:
  # Schedule: 5 posts daily at strategic times
  schedule:
    # 2 Reels + 3 Images spread throughout the day
    - cron: "0 8,11,14,17,20 * * *"  # 8am, 11am, 2pm, 5pm, 8pm UTC
  # Manual trigger
  workflow_dispatch:
  # Also runs on push (for testing)
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install requests
      
      - name: 🚀 Post to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python fb_poster.py
      
      - name: 💾 Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add posted_log.txt
          git diff --staged --quiet || git commit -m "📊 Update posting logs [skip ci]"
          git push
