name: FitLife Daily Auto-Poster

on:
  schedule:
    - cron: "0 8,11,14,17,20 * * *"  # 8am, 11am, 2pm, 5pm, 8pm UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install requests
      
      - name: 🚀 Post to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python fb_poster.py
      
      - name: 💾 Commit and push updates
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Fetch latest changes from remote
          git fetch origin main
          
          # Stash local changes
          git stash save "Temporary stash for pull" || echo "No changes to stash"
          
          # Pull latest with rebase
          git pull origin main --rebase || echo "Pull failed, continuing..."
          
          # Pop stash
          git stash pop || echo "No stash to pop"
          
          # Add and commit changes
          git add posted_log.txt
          git diff --staged --quiet || git commit -m "📊 Update posting logs [skip ci]"
          
          # Try to push with retry
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git push origin main --force-with-lease; then
              echo "✅ Push successful!"
              break
            else
              echo "⚠️ Push attempt $i failed, pulling latest..."
              git pull origin main --rebase
              sleep 5
            fi
          done
