name: FitLife Daily Auto-Poster

on:
  schedule:
    - cron: "0 8,11,14,17,20 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Generate content if needed
        run: |
          if [ ! -f "posts.csv" ] || [ ! -s "posts.csv" ]; then
            echo "Creating new content..."
            python content_generator.py
          else
            echo "Content exists"
          fi
      
      - name: Post to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python fb_poster.py
      
      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add posted_log.txt posts.csv || true
          git diff --staged --quiet || git commit -m "Update logs [skip ci]" || true
          git push origin main --force-with-lease || true
